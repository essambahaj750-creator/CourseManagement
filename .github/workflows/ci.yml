name: CI

on:
  push:
    branches: [ main, mvc-implementation, professional-refactor, redesign/ux-ui-v2 ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CourseManagement.API.slnx

      - name: Build
        run: dotnet build CourseManagement.API.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test CourseManagement.API.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

  flutter-build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CourseManagement.Flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      - name: Build Web Release
        run: flutter build web --release --dart-define=API_BASE_URL=https://api.example.com

      - name: Build Android verification APK
        run: flutter build apk --debug --dart-define=API_BASE_URL=https://api.example.com

      - name: Upload Web delivery artifact
        uses: actions/upload-artifact@v4
        with:
          name: course-management-web
          path: CourseManagement.Flutter/build/web
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: course-management-android-debug
          path: CourseManagement.Flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
