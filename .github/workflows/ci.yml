name: CI

on:
  push:
    branches: [ main, mvc-implementation, professional-refactor ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CourseManagement.API.slnx

      - name: Build
        run: dotnet build CourseManagement.API.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test CourseManagement.API.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
