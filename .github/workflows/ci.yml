name: CI

on:
  push:
    branches: [ main, mvc-implementation, professional-refactor ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CourseManagement.API.slnx

      - name: Build
        run: dotnet build CourseManagement.API.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test CourseManagement.API.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

  flutter-build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CourseManagement.Flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Must match the SDK this project is developed and pinned against.
          # pubspec.yaml requires Dart >=3.9.2 and several dependencies are held
          # at exact versions for Flutter 3.35 compatibility, so a newer SDK here
          # would test a combination nobody runs locally.
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      - name: Build Web Release
        run: flutter build web --release --dart-define=API_BASE_URL=https://localhost:7026
