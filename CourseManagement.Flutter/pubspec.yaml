publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_secure_storage: 10.3.1
  provider: ^6.1.5+1
  go_router: 14.8.1
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  file_picker: 10.2.0
  video_player: 2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
